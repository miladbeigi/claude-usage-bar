name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app bundle
        run: ./build.sh --zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageBar
          path: build/ClaudeUsageBar-*.zip*
