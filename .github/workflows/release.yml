name: Release

# Push a tag like v1.2.0 to publish a release. The app's self-updater reads the latest release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build universal app and zip
        env:
          VERSION: ${{ github.ref_name }}
          UPDATE_REPO: ${{ github.repository }}
        run: ./build.sh --zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/ClaudeUsageBar-*.zip build/ClaudeUsageBar-*.zip.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes
